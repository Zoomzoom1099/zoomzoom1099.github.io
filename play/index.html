<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARTNITE - Rooms</title>
<!--
  FARTNITE JOIN.  The Room List (ZoomNet's open and locked rooms), or a room by
  its code; the game streams straight from the host's PC over a direct
  browser-to-browser link (PeerJS).  There's no game in this file - only the
  front door - so it's fine to pass around: nobody gets anything without a room
  that's open and its password, or an approved ZoomNet account.
  Made by build_join.js from join_src.html; don't edit the output.
-->
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; color:#ebebeb; font:16px/1.4 "Futura PT",Futura,"Century Gothic","Segoe UI",Arial,sans-serif; }
  body{ background:linear-gradient(135deg,#00b4ff 0%,#1a5fd6 38%,#0a1aa0 70%,#060f5c 100%); }
  .off{ display:none !important; }
  #jf{ position:fixed; inset:0; }
  #game{ position:fixed; inset:0; background:#0b1a33; z-index:5; }
  #jf .rlb .rln b{ color:#fff; }
  #jf .rlp .rlt .zp{ margin-left:auto; font-size:13px; color:#9aa4b4; font-weight:400; }
</style>
</head>
<body>
<div id="jf"><div class="rl"><div class="rlw"><div class="rlp">
  <div class="rlt">Room List<span id="who"></span></div>
  <div class="rlh"><span class="c1">ROOM NAME</span><span class="c2">PLAYERS</span><span class="c3">PASSWORD</span><span class="c4">MODE</span><span class="c5">STATUS</span></div>
  <div class="rlb" id="rooms"></div>
</div>
<div class="rlf"><button data-a="login" id="lg">Log in</button><button data-a="news">* News *</button><span class="rlm" id="msg"></span><button data-a="code">Code</button><button data-a="refresh">Refresh</button><button data-a="join" id="jg">Join</button></div>
</div><div id="dlg"></div></div></div>
<div id="game" class="off"></div>

var KEEP = {};

}

async function rpc(name, args){

ZN.rpc = rpc;

var me = null, session = null;

var NAME_RE = /^[a-z0-9_]{3,16}$/;

var BAD = ['admin','administrator','moderator','zoomos','zoomnet','owner','support','system','official',
  'aronmcfarland','mcfarland','nigg','faggot','fag','retard','tranny','kike','chink','gook','wetback',
  'rapist','nazi','hitler','kkk','pedo','molest','cunt','whore','slut','penis','vagina','dick','pussy',

  if (!NAME_RE.test(u)) return 'Only letters, numbers and _ in usernames.';

  if (/ZN_BAD_USERNAME|Database error/i.test(m)) return 'That username is not allowed or is taken.';
  if (/Invalid login credentials/i.test(m)) return 'Wrong username or password.';
  if (/rate limit|too many/i.test(m)) return 'Too many tries from this network. Wait a few minutes.';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'The server refused the account address. (Owner: see SETUP.md, Troubleshooting.)';

function skipKey(k){

  try { if (window.ZOS_SAVE && ZOS_SAVE.all) map[SHELL_KEY] = JSON.stringify(ZOS_SAVE.all()); } catch (e) {}
  var keys = Object.keys(map).sort(), o = {};
  keys.forEach(function(k){ o[k] = map[k]; });

  var empty = !keys.length || (keys.length === 1 && keys[0] === SHELL_KEY && (o[SHELL_KEY] === '{}' || !o[SHELL_KEY]));
  return { map: o, json: json, n: keys.length, hash: fnv(json), empty: empty };
}

  try {

  if (!ok) { var mem = null; try { mem = JSON.parse(map[SHELL_KEY] || '{}'); } catch (e) {} ZN.memFallback = function(){ return mem || {}; }; }

async function encode(c){

  S.busy = true;
  try {
    var data = await encode(c);
    S.prepared = { hash: c.hash, data: data };
    if (data.body.length > CFG.saveCap) {
      setStatus('toobig', 'This save is ' + (data.body.length / 1e6).toFixed(1) + ' MB packed; the cloud takes ' + (CFG.saveCap / 1e6).toFixed(1) + ' MB. Delete big pictures (wallpapers, paintings) to make room.');
      return;

      var q = ZN.sb.from('saves').update({ data: data, device: DEVICE }).eq('user_id', uid());
      if (!force) q = q.eq('rev', S.rev);

}

/* Runs BEFORE the shell exists: decide whose save this browser should hold. */
async function bootSync(){
  if (!me || !(me.status === 'approved' || me.is_admin)) return { mode: 'off' };
  S.rev = Number(kept('zn.rev') || 0); S.synced = kept('zn.synced');
  var owner = kept('zn.owner');
  /* not provably this account's: someone else's, or nobody's - never adopt it */
  if (owner !== me.id) { wipeZoomKeys(); S.rev = 0; S.synced = null; keep('zn.rev', null); keep('zn.synced', null); }
  var local = collect(), remote = null;
  try { remote = await remoteFull(); } catch (e) {
    return { mode: 'error', error: isNet(e) ? 'Could not reach the cloud save. Playing without it would risk overwriting it.' : (e.message || 'Cloud save error') };
  }
  keep('zn.owner', me.id);
  if (!remote) { S.rev = 0; return { mode: local.empty ? 'new' : 'local' }; }
  var rd;
  try { rd = await decode(remote.data); } catch (e) { return { mode: 'error', error: 'The cloud save did not read (' + e.message + ').' }; }
  if (local.empty || rd.hash === local.hash || local.hash === S.synced || owner !== me.id) {
    applyMap(rd.map); markSynced(remote.rev, rd.hash);
    return { mode: 'cloud', at: remote.updated_at };
  }
  if (remote.rev === S.rev) return { mode: 'local' };   /* only this browser changed: keep it, push soon */
  /* both changed since the last sync */
  return { mode: 'ask', remote: remote, decoded: rd, local: local };
}
/* The USB ZoomOS (zn_local.js): the shell is already running on this browser's own save, so nothing here wipes anything unasked.

  try { lsSet('zn.backup', JSON.stringify({ at: Date.now(), from: from, json: json })); } catch (e) {}
}
async function localSync(ask){

  S.rev = Number(kept('zn.rev') || 0); S.synced = kept('zn.synced');

  if (!remote) { keep('zn.owner', me.id); S.rev = 0; setStatus('saved', ''); if (!local.empty) schedule(2000); return { mode: 'local' }; }
  try { rd = await decode(remote.data); } catch (e) { setStatus('error', 'The cloud save did not read (' + e.message + ').'); return { mode: 'error' }; }

/* ------------------------------------------------------------------ full ZoomOS (encrypted, from GitHub Pages) */
var KEYS = {};          /* version -> CryptoKey, memory only, never stored */
var MANIFEST = null;
var PARTS = {};         /* file -> Promise<Uint8Array> */
async function getKey(v){
  if (KEYS[v]) return KEYS[v];
  var r = await ZN.sb.from('zn_keys').select('version,key').eq('version', v).maybeSingle();
  if (r.error) throw new Error(isNet(r.error) ? 'Could not reach ZoomNet.' : r.error.message);
  if (!r.data) throw new Error('No key for this build (version ' + v + '). Your account may not be approved, or the owner has not run the key SQL yet.');
  var raw = unb64(r.data.key);
  KEYS[v] = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
  return KEYS[v];
}
async function getManifest(){
  if (MANIFEST) return MANIFEST;
  var res = await fetch(CFG.fullBase + 'manifest.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('The full ZoomOS files are not uploaded yet (manifest ' + res.status + ').');
  MANIFEST = await res.json();
  return MANIFEST;
}
async function fetchBytes(url, total, onp){
  var res = await fetch(url);
  if (!res.ok) throw new Error('Download failed: ' + url.split('/').pop() + ' (' + res.status + ')');
  if (!res.body || !onp) return new Uint8Array(await res.arrayBuffer());
  var rd = res.body.getReader(), chunks = [], got = 0;
  for (;;) {
    var x = await rd.read(); if (x.done) break;
    chunks.push(x.value); got += x.value.length; try { onp(got, total); } catch (e) {}
  }
  var out = new Uint8Array(got), o = 0;
  chunks.forEach(function(c){ out.set(c, o); o += c.length; });
  return out;
}
/* one part: download -> AES-GCM decrypt (IV = first 12 bytes) -> gunzip */
function part(ent, onp){
  if (!PARTS[ent.file]) {
    PARTS[ent.file] = (async function(){
      var m = await getManifest();
      var key = await getKey(m.keyVersion);
      var buf = await fetchBytes(CFG.fullBase + ent.file, ent.bytes, onp);
      var plain;
      try { plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12))); }
      catch (e) { throw new Error('This build does not match the key (decrypt failed). Refresh; if it keeps happening, the owner needs to re-run the key SQL.'); }
      return ent.gz === false ? plain : await gunzip(plain);
    })();
    PARTS[ent.file].catch(function(){ delete PARTS[ent.file]; });
  }
  return PARTS[ent.file];
}
function stampText(){
  var u = me ? me.username : '?', id = me ? String(me.id).slice(0, 8) : '?';
  return 'licensed to ' + u + ' (' + id + ') ' + new Date().toISOString().slice(0, 16);
}
function stampHtml(html){
  var t = stampText().replace(/-->/g, '');
  return html.replace('<!--ZN_LICENSEE-->', function(){ return '<!-- ' + t + ' --><script>window.ZOS_LICENSEE=' + JSON.stringify(t) + ';<\/script>'; });
}
var APP_HTML = {};
async function appHtml(id, onp){
  if (APP_HTML[id]) return APP_HTML[id];
  var m = await getManifest(), ent = m.apps && m.apps[id];
  if (!ent) throw new Error('No such part: ' + id);
  var html = stampHtml(new TextDecoder().decode(await part(ent, onp)));

}
var ASSET_URL = {};
function assetUrl(id){
  if (!ASSET_URL[id]) {
    ASSET_URL[id] = (async function(){
      var m = await getManifest(), ent = m.assets && m.assets[id];
      if (!ent) return null;
      var bytes = await part(ent);
      /* the apps only accept data: URLs (they check the prefix), so build one */
      return await new Promise(function(res){
        var fr = new FileReader();
        fr.onload = function(){ res(fr.result); };
        fr.onerror = function(){ res(null); };
        fr.readAsDataURL(new Blob([bytes], { type: ent.mime || 'audio/mpeg' }));
      });
    })();
    ASSET_URL[id].then(function(u){ if (!u) delete ASSET_URL[id]; }, function(){ delete ASSET_URL[id]; });
  }
  return ASSET_URL[id];
}

/* The core boot: key + manifest + core, cloud save, then the shell replaces this page. */
ZN.full = {
  manifest: getManifest,
  available: async function(){ try { await getManifest(); return true; } catch (e) { return false; } },
  /* ui: {progress(fraction, text), ask(res) -> Promise<bool useCloud>} */
  boot: async function(ui){
    ui = ui || {};
    var say = function(f, t){ try { ui.progress && ui.progress(f, t); } catch (e) {} };
    if (!me || !(me.status === 'approved' || me.is_admin)) throw new Error('Full ZoomOS is for approved accounts.');
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('This browser is too old for full ZoomOS (needs WebCrypto + DecompressionStream; use Chrome).');
    say(0.02, 'Checking your account');
    var m = await getManifest();
    await getKey(m.keyVersion);
    say(0.06, 'Downloading ZoomOS (' + kb(m.core.bytes) + ')');
    var coreP = part(m.core, function(g, t){ say(0.06 + 0.74 * Math.min(1, g / (t || 1)), 'Downloading ZoomOS (' + kb(g) + ' of ' + kb(t) + ')'); });
    say(0.06, 'Fetching your cloud save');

    if (sync.mode === 'error') throw new Error(sync.error);

    var html = new TextDecoder().decode(await coreP);

    S.status = 'saved';
    if (sync.mode === 'local' || sync.mode === 'ask') setTimeout(function(){ schedule(4000); }, 0);
    /* the shell takes over THIS window: same origin, same window.ZN */
    setTimeout(function(){
      document.open();
      document.write(html);
      document.close();
    }, 30);
    return true;
  }
};

    '@ .c5 small{font-size:11px;color:#d9a441}', '@ .c5 i{width:11px;height:11px;border-radius:50%;flex:none}',
    '@ .c5 i.d0{background:#5fc96a}', '@ .c5 i.d1{background:#e3b341}', '@ .c5 i.d2{background:#777}',
    '@ .rlh .c4,@ .rlh .c5{font-size:13.5px;color:#5c5c5c}',
    '@ .rln{padding:22px 16px;color:#8c8c8c;font-size:16px}',
    '@ .rlf{display:flex;align-items:center;gap:13px;margin-top:12px}',
    '@ .rlf button,@ .rldb button{height:38px;padding:0 20px;border:0;border-radius:2px;background:#4d77b0;color:#fff;font:400 18px "Futura PT",Futura,"Century Gothic","Segoe UI",Arial,sans-serif;text-transform:uppercase;letter-spacing:.3px;cursor:pointer}',
    '@ .rlf button:hover,@ .rldb button:hover{background:#5a86c2}',
    '@ .rlf button:disabled,@ .rldb button:disabled{background:#3a4658;color:#9aa4b4;cursor:default}',
    '@ .rlf #ntJg{min-width:112px}',
    '@ .rlm{flex:1;text-align:center;font-size:14px;color:#ffd27a;text-shadow:0 1px 2px rgba(0,0,0,.6)}',
    '@ .rld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}',
    '@ .rldp{width:min(440px,92vw);max-height:90vh;overflow:auto;background:#282828;border-radius:7px;padding:20px 22px 18px;box-shadow:0 8px 34px rgba(0,0,0,.5)}',
    '@ .rldt{font-weight:700;font-size:20px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:9px}',
    '@ .rldp label{font:400 12.5px "Futura PT",Futura,"Century Gothic","Segoe UI",Arial,sans-serif;letter-spacing:.6px;color:#8c8c8c;margin:12px 0 5px}',
    '@ .rldp label span{color:#5c5c5c}',
    '@ .rldp input{background:#1f1f1f;border:1px solid #3c3c3c;border-radius:3px;color:#ebebeb;padding:9px 11px;font:400 17px "Futura PT",Futura,"Century Gothic","Segoe UI",Arial,sans-serif}',
    '@ .rldp input:focus{border-color:#4d77b0}',
    '@ .rldp input.rlcode{text-transform:uppercase;letter-spacing:5px;font-size:20px}',
    '@ .rlmo{display:flex;gap:8px}', '@ .rlmo div{flex:1;background:#2f2f2f;border:2px solid #2f2f2f;border-radius:3px;padding:9px 10px;cursor:pointer}',
    '@ .rlmo div:hover{background:#363636}', '@ .rlmo div.on{border-color:#4d77b0;background:#33394a}',
    '@ .rlmo b{display:block;font-weight:700;font-size:15px}', '@ .rlmo small{display:block;color:#9a9a9a;font-size:12px;margin-top:2px}',
    '@ .rlck{display:flex !important;gap:8px;align-items:flex-start;cursor:pointer;color:#b0b0b0 !important;letter-spacing:0 !important;font-size:13px !important;line-height:1.35}',
    '@ .rlck input{width:auto;margin-top:2px}',
    '@ .rlsm{color:#8c8c8c;font-size:13px;line-height:1.4;margin-top:10px}',
    '@ .rlm2{min-height:18px;margin-top:12px;color:#ffb35e;font-size:14px}',
    '@ .rldb{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}',
    '@ .rlnews p{margin:10px 0;color:#d4d4d4;font-size:15px;line-height:1.4}', '@ .rlnews b{color:#fff;margin-right:8px}',
    '@ .rldp label{display:block}', '@ .rldp input{display:block;width:100%;box-sizing:border-box;outline:none}'
];
function fnjRlCss(sc){ return FNJ_RL_CSS.map(function(r){ return r.split('@ ').join(sc + ' '); }).join('\n'); }
function fnjEsc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function fnjRoomName(m){ return m.nm ? String(m.nm) : String(m.host || '?') + '\'s Game'; }
/* one room's row: m (the host's presence line), the picked one's code, your build (the "other version" note; none: no note),
   the row's own attribute (what a click on it does) */
function fnjRlRow(m, sel, mine, attr){
  var max = m.max || 4, full = m.n >= max, other = mine && m.b && m.b !== mine;
  var stt = full ? 'Full' : m.inM ? 'In a match' : 'In the lobby';
  return '<div class="rlr' + (sel === m.code ? ' sel' : '') + (full ? ' full' : '') + '" ' + attr + ' data-c="' + fnjEsc(m.code) + '">' +
    '<span class="c1">' + fnjEsc(fnjRoomName(m)) + '</span><span class="c2">' + (m.n | 0) + '/' + max + '</span><span class="c3">' + (m.locked ? FNJ_LOCK : '') + '</span>' +
    '<span class="c4">' + (m.mode === '1v1' ? '1v1 build battle' : m.mode === 'coop' ? 'co-op squad' : '') + '</span>' +
    '<span class="c5">' + (other ? '<small title="Not the same FARTNITE as yours: theirs loads from their PC">other version</small>' : '') + stt + '<i class="' + (full ? 'd2' : m.inM ? 'd1' : 'd0') + '"></i></span></div>';
}
var FNJ_NEWS = [
  ['v3.6', 'The new Room List. Locked rooms show a lock and ask for the password; name your room when you CREATE it.'],
  ['v3.5', 'The FARTNITE JOIN file: friends join from a file, nothing to install. Join from ZoomOS with no ZoomNet needed. A different version from the host? Theirs loads from their PC.'],
  ['v3.4.1', 'Co-op fixes: your squad sees each other\'s kills, nobody freezes after a wifi hiccup, and blocked networks go through a relay.'],
  ['v3.4', 'CO-OP SQUADS: you and up to 3 friends, one squad in a full match.'],
  ['v3.2', '1V1 BUILD BATTLE: a floating arena, first to 5.']
];
/* the list itself, live: ZoomNet's presence channel the hosts are on (anyone can watch it; only hosts put a line in) */
var FNJ_ROOMS = 'zoomnet-fartnite-rooms';
function fnjRoomsSort(st, skip){
  var L = [], seen = {};
  for(var k in st){ (st[k] || []).forEach(function(m){ if(!m || !m.code || m.v !== 1 || seen[m.code] || (skip && m.tid === skip)) return; seen[m.code] = 1; L.push(m); }); }
  L.sort(function(x, y){ return (x.locked - y.locked) || (x.n - y.n) || String(x.host).localeCompare(String(y.host)); });
  return L;
}

</script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); }, esc = fnjEsc, ZN = window.ZN || null;
  var st = document.createElement('style'); st.textContent = fnjRlCss('#jf'); document.head.appendChild(st);
  function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  var R = { rooms:[], ok:false, err:false, sel:null, dlg:null, dc:null, ch:null, tid:'j' + Math.random().toString(36).slice(2, 8), base:'', pct:'' };
  function me(){ return ZN && ZN.user ? ZN.user() : null; }
  function approved(){ var u = me(); return !!(u && (u.status === 'approved' || u.is_admin) && u.status !== 'banned'); }
  function say(t, cls){ R.base = t || ''; var m = $('dmsg') || $('msg'); if(m){ m.textContent = R.base + R.pct; m.style.color = cls === 'wait' ? '#ffd27a' : cls === 'ok' ? '#8dff7a' : ''; } }
  function bar(f){ R.pct = f == null ? '' : ' ' + Math.round(f * 100) + '%'; say(R.base); }

  /* ---- the game: streamed from the host, run in a frame over this ---- */
  var J = fnjMake({
    say:function(t, cls){ say(t, cls); }, bar:bar, mount:$('game'),
    pass:function(code){ if(!ZN || !approved()) return Promise.resolve(null); return ZN.rpc('zn_room_pass', { p_code:code }).then(function(r){ var x = r && r.data; if(x && x.reason === 'banned') say('You\'re banned from the rooms for now.'); return x && x.ok ? String(x.pass) : null; }, function(){ return null; }); },
    onBoot:function(){ $('game').classList.remove('off'); $('jf').classList.add('off'); document.title = 'FARTNITE - Room ' + J.link.code; },
    onEnd:function(text, cls){ $('game').classList.add('off'); $('jf').classList.remove('off'); busy(false); R.pct = ''; say(text, cls); document.title = 'FARTNITE - Rooms'; }
  });
  function busy(on){ var b = $('jg'); if(b){ b.disabled = !!on; b.textContent = on ? 'Joining...' : 'Join'; } }
  function nameNow(){ var u = me(); return u ? u.username : ls('fnj.name') || ''; }
  function go(code, pass, name){
    if(J.busy()) return;
    var err = J.join(name || nameNow(), code, pass);
    if(err){ say(err); return; }
    ls('fnj.code', String(code).toUpperCase()); if(name) ls('fnj.name', name);
    R.dlg = null; paintDlg(); busy(true);
  }

  /* ---- the rooms: ZoomNet's list, live ---- */
  function rooms(){
    if(R.ch || !ZN || !ZN.sb) return;
    R.ok = false; R.err = false;
    try{
      var ch = R.ch = ZN.sb.channel(FNJ_ROOMS, { config:{ presence:{ key:'join:' + R.tid } } });
      ch.on('presence', { event:'sync' }, function(){ if(R.ch !== ch) return; var s = {}; try{ s = ch.presenceState() || {}; }catch(e){} R.rooms = fnjRoomsSort(s, null); paint(); })
        .subscribe(function(s){ if(R.ch !== ch) return; if(s === 'SUBSCRIBED'){ R.ok = true; R.err = false; } else if(s === 'CHANNEL_ERROR' || s === 'TIMED_OUT'){ R.ok = false; R.err = true; } paint(); });
    }catch(e){ R.ch = null; R.err = true; }
  }
  function paint(){
    var h = '', note = function(t){ return '<div class="rln">' + t + '</div>'; };
    if(!ZN || !ZN.sb) h = note('Can\'t reach ZoomNet from here, so no room list. You can still join a room with its <b>CODE</b>.');
    else if(R.err) h = note('Can\'t reach the room list right now. Press <b>REFRESH</b>, or join with a <b>CODE</b>.');
    else if(!R.ok) h = note('Looking for rooms...');
    else if(!R.rooms.length) h = note('No rooms right now. Ask your friend for their room <b>CODE</b>.');
    else R.rooms.forEach(function(m){ h += fnjRlRow(m, R.sel, null, 'data-a="sel"'); });
    var e = $('rooms'); if(e.innerHTML !== h) e.innerHTML = h;
    var u = me(), who = $('who');
    who.textContent = u ? 'playing as ' + u.username + (approved() ? '' : ' (not approved yet: locked rooms only)') : 'not logged in: locked rooms only';
    $('lg').textContent = u ? 'Log out' : 'Log in';
  }
  function roomOf(c){ for(var i = 0; i < R.rooms.length; i++) if(R.rooms[i].code === c) return R.rooms[i]; return null; }
  function listJoin(code){
    var m = roomOf(code || R.sel);
    if(!m){ say(R.rooms.length ? 'Pick a room first.' : 'No room picked. Join with a CODE.'); return; }
    if(m.n >= (m.max || 4)){ say('That room is full.'); return; }
    if(m.locked){ R.dc = m.code; R.dlg = 'pw'; paintDlg(); return; }
    if(!me()){ R.dlg = 'login'; R.after = m.code; paintDlg(); say('Open rooms need a ZoomNet login.'); return; }
    if(!approved()){ say('Open rooms are for approved ZoomNet accounts. Ask Zoom to approve you.'); return; }
    go(m.code, '');
  }

  /* ---- the little windows: log in, a locked room's password, a code, the news ---- */
  function paintDlg(){
    var d = R.dlg, box = $('dlg'), h = '', v = function(k){ return esc(ls(k) || ''); };
    var msg = '<div class="rlm2" id="dmsg"></div>';
    if(d === 'login') h = '<div class="rldp"><div class="rldt">Log in to ZoomNet</div><div class="rlsm">The same account as ZoomOS. Approved accounts can join the open rooms.</div>' +
      '<label>USERNAME</label><input id="du" maxlength="16" autocomplete="username" spellcheck="false"><label>PASSWORD</label><input id="dp" type="password" maxlength="72" autocomplete="current-password">' +
      msg + '<div class="rldb"><button data-a="close">Cancel</button><button data-a="dologin">Log in</button></div></div>';
    else if(d === 'pw'){ var m = roomOf(R.dc);
      h = '<div class="rldp"><div class="rldt">' + FNJ_LOCK + ' ' + esc(m ? fnjRoomName(m) : 'Room ' + R.dc) + '</div><div class="rlsm">This room is locked. Type its password.</div>' +
        (me() ? '' : '<label>YOUR NAME</label><input id="dn" maxlength="16" autocomplete="off" spellcheck="false" value="' + v('fnj.name') + '">') +
        '<label>PASSWORD</label><input id="dp" maxlength="24" autocomplete="off" spellcheck="false">' +
        msg + '<div class="rldb"><button data-a="close">Cancel</button><button data-a="dopw">Join</button></div></div>'; }
    else if(d === 'code') h = '<div class="rldp"><div class="rldt">Join with a code</div>' +
      (me() ? '' : '<label>YOUR NAME</label><input id="dn" maxlength="16" autocomplete="off" spellcheck="false" value="' + v('fnj.name') + '">') +
      '<label>ROOM CODE</label><input id="dc" class="rlcode" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC123" value="' + esc(R.hash || ls('fnj.code') || '') + '">' +
      '<label>PASSWORD</label><input id="dp" maxlength="24" autocomplete="off" spellcheck="false" placeholder="IF IT HAS ONE">' +
      msg + '<div class="rldb"><button data-a="close">Cancel</button><button data-a="docode">Join</button></div></div>';
    else if(d === 'news') h = '<div class="rldp rlnews"><div class="rldt">News</div>' + FNJ_NEWS.map(function(n){ return '<p><b>' + n[0] + '</b>' + esc(n[1]) + '</p>'; }).join('') +
      '<div class="rldb"><button data-a="close">Close</button></div></div>';
    box.innerHTML = h ? '<div class="rld">' + h + '</div>' : '';
    var f = d === 'login' ? $('du') : d === 'pw' ? ($('dn') && !$('dn').value ? $('dn') : $('dp')) : d === 'code' ? ($('dn') && !$('dn').value ? $('dn') : $('dc').value ? $('dp') : $('dc')) : null;
    if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} }, 30);
  }
  function val(id){ var e = $(id); return e ? e.value : ''; }
  function nameOk(){ var n = $('dn'); if(!n) return nameNow(); var x = n.value.trim(); if(!x){ say('Type your name.'); n.focus(); return null; } return x; }
  function act(a, el){
    if(a === 'close'){ R.dlg = null; R.after = null; paintDlg(); say(''); return; }
    if(a === 'news' || a === 'code'){ R.dlg = a; paintDlg(); return; }
    if(a === 'sel'){ R.sel = el.getAttribute('data-c'); say(''); paint(); return; }
    if(a === 'join'){ listJoin(); return; }
    if(a === 'refresh'){ if(R.ch && R.err){ try{ ZN.sb.removeChannel(R.ch); }catch(e){} R.ch = null; } if(!R.ch) rooms(); paint(); return; }
    if(a === 'login'){ if(me()){ ZN.auth.logOut().then(paint); say('Logged out.'); } else { R.dlg = 'login'; paintDlg(); } return; }
    if(a === 'dologin'){
      var b = el; b.disabled = true; say('Logging in...', 'wait');
      ZN.auth.logIn(val('du'), val('dp')).then(function(r){
        b.disabled = false;
        if(!r || !r.ok){ say((r && r.error) || 'Couldn\'t log in.'); return; }
        var after = R.after; R.dlg = null; R.after = null; paintDlg(); paint(); say('Logged in as ' + r.user.username + '.', 'ok');
        if(after) listJoin(after);
      });
      return;
    }
    if(a === 'dopw'){ var n1 = nameOk(); if(n1 == null) return; go(R.dc, val('dp'), n1); return; }
    if(a === 'docode'){ var n2 = nameOk(); if(n2 == null) return; go(val('dc'), val('dp'), n2); return; }
  }
  document.addEventListener('click', function(e){ var b = e.target.closest ? e.target.closest('[data-a]') : null; if(b && !b.disabled) act(b.getAttribute('data-a'), b); });
  $('rooms').addEventListener('dblclick', function(e){ var r = e.target.closest ? e.target.closest('[data-a="sel"]') : null; if(r) listJoin(r.getAttribute('data-c')); });
  document.addEventListener('keydown', function(e){
    if(!R.dlg || $('jf').classList.contains('off')) return;
    if(e.key === 'Escape'){ act('close'); return; }
    if(e.key === 'Enter'){ var q = { login:'dologin', pw:'dopw', code:'docode' }[R.dlg]; if(q){ var b = document.querySelector('[data-a="' + q + '"]'); if(b && !b.disabled) act(q, b); } }
  });

  /* ---- starting up: a code in the link (#ABC123) opens the code box with it ---- */
  var hc = (location.hash || '').replace('#', '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(hc.length === 6){ R.hash = hc; R.dlg = 'code'; paintDlg(); }
  rooms(); paint();
  if(ZN && ZN.ready) ZN.ready.then(paint, paint);
  if(ZN && ZN.on) ZN.on('user', paint);
})();
</script>
</body>
